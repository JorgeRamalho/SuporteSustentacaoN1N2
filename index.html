<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sentinela · Sustentação N1/N2</title>
    <script>
      (function () {
        var host = location.hostname.toLowerCase();
        if (host === "localhost") {
          location.replace(
            "http://127.0.0.1:" +
              (location.port || "5500") +
              location.pathname +
              location.search +
              location.hash,
          );
          return;
        }
        var local =
          location.protocol === "file:" || host === "127.0.0.1" || host === "localhost";
        if (!local) {
          window.SENTINELA_DEMO_MODE = true;
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./frontend/live-bootstrap.js"></script>
  </body>
</html>
