name: GitHub Pages — live bundle

on:
  push:
    branches: [main]
    paths:
      - "frontend/src/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/vite.live.config.js"
      - "frontend/index.html"
      - "frontend/demo/**"
      - "index.html"
      - ".github/workflows/github-pages-bundle.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build live bundle
        run: npm run live:bundle
        working-directory: frontend

      - name: Commit bundle if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(pages): rebuild frontend live-dist"
          file_pattern: frontend/live-dist/*
