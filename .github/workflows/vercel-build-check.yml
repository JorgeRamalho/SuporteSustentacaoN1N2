name: Console — build Vercel

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "index.html"
      - "vercel.json"
      - "scripts/prepare-vercel-deploy.cjs"
      - ".github/workflows/vercel-build-check.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SENTINELA_API_ORIGIN: https://sentinela-api-eavd.onrender.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build console (mesmo fluxo da Vercel)
        run: |
          node scripts/prepare-vercel-deploy.cjs
          npm ci --prefix frontend
          npm run live:bundle --prefix frontend

      - name: Verificar bundle
        run: test -f frontend/live-dist/live-bundle.js
