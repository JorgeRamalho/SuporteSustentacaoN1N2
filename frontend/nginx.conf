server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000;
    }

    location /docs {
        proxy_pass http://api:8000;
    }

    location /openapi.json {
        proxy_pass http://api:8000;
    }

    location /redoc {
        proxy_pass http://api:8000;
    }

    location / {
        try_files $uri /index.html;
    }
}
