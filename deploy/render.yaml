# Blueprint: API Python com disco persistente para SQLite em /app/data
# Render lê render.yaml só na raiz do repositório — ao usar Blueprint, copie ou vincule este arquivo.
# Ver deploy/README.md
services:
  - type: web
    name: sentinela-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: sentinela-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: SENTINELA_ROOT
        value: /app
      - key: SIMULATE
        value: "true"
      - key: ALLOW_REAL_ACTIONS
        value: "false"
